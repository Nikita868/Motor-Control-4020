<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 650" aria-labelledby="vpSvgTitle vpSvgDesc"><title id="vpSvgTitle">Trace visual fields through the retinas to the opposite visual cortex</title><desc id="vpSvgDesc">Left and right refer to the person. Left field light reaches left nasal and right temporal retina, then right cortex. Right field light reaches left temporal and right nasal retina, then left cortex. Only nasal retinal fibers cross at the chiasm.</desc>
<rect width="740" height="650" rx="12" fill="#fafcfd" />
<path d="M370 35V625" stroke="#b5bec7" stroke-dasharray="5 6" />
<text x="370" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#344859">Person’s left ←  |  → Person’s right</text>
<rect x="85" y="38" width="270" height="64" rx="9" fill="#f8e6f0" /><rect x="385" y="38" width="270" height="64" rx="9" fill="#e6edff" />
<text x="220" y="62" text-anchor="middle" fill="#a42b74" font-weight="700" font-family="Arial, sans-serif" font-size="14">LEFT visual field</text><text x="520" y="62" text-anchor="middle" fill="#2859b6" font-weight="700" font-family="Arial, sans-serif" font-size="14">RIGHT visual field</text>
<text x="370" y="122" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" fill="#344859">Fixation at the midline • sample targets within binocular overlap</text>
<g data-vp-field="left" data-vp-stage="1"><circle cx="155" cy="85" r="9" fill="#b63580" /><text x="175" y="90" fill="#a42b74" font-family="Arial, sans-serif" font-size="14">L target</text></g>
<g data-vp-field="right" data-vp-stage="1"><rect x="575" y="77" width="16" height="16" fill="#2e61c5" /><text x="545" y="90" text-anchor="end" fill="#2859b6" font-family="Arial, sans-serif" font-size="14">R target</text></g>
<text x="95" y="170" font-weight="700" font-family="Arial, sans-serif" font-size="14" fill="#344859">LIGHT</text>
<ellipse cx="220" cy="225" rx="53" ry="55" fill="white" stroke="#8297a6" stroke-width="2" /><ellipse cx="520" cy="225" rx="53" ry="55" fill="white" stroke="#8297a6" stroke-width="2" />
<ellipse cx="220" cy="191" rx="17" ry="5" fill="#cce3ee" /><ellipse cx="520" cy="191" rx="17" ry="5" fill="#cce3ee" />
<text x="220" y="155" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif" font-size="14" fill="#344859">LEFT EYE</text><text x="520" y="155" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif" font-size="14" fill="#344859">RIGHT EYE</text>
<text x="370" y="220" text-anchor="middle" fill="#667785" font-family="Arial, sans-serif" font-size="14">NOSE</text>
<text x="158" y="253" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#344859">Temporal</text><text x="282" y="253" font-family="Arial, sans-serif" font-size="14" fill="#344859">Nasal</text><text x="458" y="253" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#344859">Nasal</text><text x="582" y="253" font-family="Arial, sans-serif" font-size="14" fill="#344859">Temporal</text>
<text x="370" y="291" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" fill="#344859">Retinal locations (inside the eyes)</text>
<text x="91" y="334" font-size="13" font-family="Arial, sans-serif" fill="#344859">Optic nerve</text><text x="570" y="334" font-size="13" font-family="Arial, sans-serif" fill="#344859">Optic nerve</text>
<rect x="321" y="365" width="98" height="35" rx="16" fill="#f0eee8" stroke="#c7c3b6" />
<text x="370" y="355" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif" font-size="14" fill="#344859">Optic chiasm</text>
<text x="95" y="424" font-family="Arial, sans-serif" font-size="14" fill="#344859">Optic tract</text><text x="569" y="424" font-family="Arial, sans-serif" font-size="14" fill="#344859">Optic tract</text>
<rect x="170" y="460" width="100" height="43" rx="12" fill="#f7efdb" stroke="#b7a57c" /><rect x="470" y="460" width="100" height="43" rx="12" fill="#f7efdb" stroke="#b7a57c" />
<text x="370" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#344859">LGN</text><text x="370" y="498" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" fill="#344859">thalamus relay</text>
<text x="370" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#344859">Optic radiations</text>
<rect x="135" y="590" width="170" height="45" rx="14" fill="#e9e4f0" stroke="#ad9dbf" /><rect x="435" y="590" width="170" height="45" rx="14" fill="#e9e4f0" stroke="#ad9dbf" />
<text x="220" y="617" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif" font-size="14" fill="#344859">LEFT visual cortex</text><text x="520" y="617" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif" font-size="14" fill="#344859">RIGHT visual cortex</text>
<g data-vp-field="left" data-vp-eye="left" data-vp-stage="2"><path d="M155 96 L220 190 L250 270" fill="none" stroke="#b63580" stroke-width="2" opacity=".8" /><circle cx="250" cy="270" r="7" fill="#b63580" /></g><g data-vp-field="left" data-vp-eye="left" data-vp-stage="3"><path d="M250 270 C250 324 300 340 370 382 S500 431 510 460" fill="none" stroke="#b63580" stroke-width="5" stroke-dasharray="9 5" /></g><g data-vp-field="left" data-vp-eye="left" data-vp-stage="4"><path d="M510 503 Q475 550 510 585" fill="none" stroke="#b63580" stroke-width="4" /><path d="M505 578 L510 587 L515 578" fill="none" stroke="#b63580" stroke-width="3" /></g><g data-vp-field="left" data-vp-eye="right" data-vp-stage="2"><path d="M155 96 L520 190 L550 270" fill="none" stroke="#b63580" stroke-width="2" opacity=".8" /><circle cx="550" cy="270" r="7" fill="#b63580" /></g><g data-vp-field="left" data-vp-eye="right" data-vp-stage="3"><path d="M550 270 C550 321 435 350 435 382 S548 423 530 460" fill="none" stroke="#b63580" stroke-width="5" /></g><g data-vp-field="left" data-vp-eye="right" data-vp-stage="4"><path d="M530 503 Q565 550 530 585" fill="none" stroke="#b63580" stroke-width="4" /><path d="M525 578 L530 587 L535 578" fill="none" stroke="#b63580" stroke-width="3" /></g><g data-vp-field="right" data-vp-eye="left" data-vp-stage="2"><path d="M583 96 L220 190 L190 270" fill="none" stroke="#2e61c5" stroke-width="2" opacity=".8" /><circle cx="190" cy="270" r="7" fill="#2e61c5" /></g><g data-vp-field="right" data-vp-eye="left" data-vp-stage="3"><path d="M190 270 C190 321 305 350 305 382 S192 423 210 460" fill="none" stroke="#2e61c5" stroke-width="5" /></g><g data-vp-field="right" data-vp-eye="left" data-vp-stage="4"><path d="M210 503 Q175 550 210 585" fill="none" stroke="#2e61c5" stroke-width="4" /><path d="M205 578 L210 587 L215 578" fill="none" stroke="#2e61c5" stroke-width="3" /></g><g data-vp-field="right" data-vp-eye="right" data-vp-stage="2"><path d="M583 96 L520 190 L490 270" fill="none" stroke="#2e61c5" stroke-width="2" opacity=".8" /><circle cx="490" cy="270" r="7" fill="#2e61c5" /></g><g data-vp-field="right" data-vp-eye="right" data-vp-stage="3"><path d="M490 270 C490 324 440 340 370 382 S240 431 230 460" fill="none" stroke="#2e61c5" stroke-width="5" stroke-dasharray="9 5" /></g><g data-vp-field="right" data-vp-eye="right" data-vp-stage="4"><path d="M230 503 Q265 550 230 585" fill="none" stroke="#2e61c5" stroke-width="4" /><path d="M225 578 L230 587 L235 578" fill="none" stroke="#2e61c5" stroke-width="3" /></g></svg>