            <path d="M235 32 A128 128 0 0 1 235 288" fill="none" stroke="#d99" stroke-width="7" opacity=".6" />
            
            <path d="M107 128 q-30 32 0 64" fill="#dceef1" stroke="#7fb6bf" stroke-width="3" />
            
            <path d="M118 120 q-18 40 0 80 q22 -10 22 -40 q0 -30 -22 -40 Z" fill="#e6f4f6" opacity=".7" />
            
            <rect x="130" y="112" width="12" height="30" rx="3" fill="#b9802f" />
