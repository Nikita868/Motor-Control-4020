<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" id="eyeSvg" viewBox="0 0 480 320" aria-label="Horizontal cross-section of the eye showing the cornea, pupil and iris, lens, the fluid-filled chambers, and the retina with its fovea, macula, and optic disc at the back.">
            
